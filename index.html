<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="YerionHub">
<meta property="og:description" content="faviiona’s corner of the internet: games, socials, and contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<style>
:root{--ac:#0b7285;--on:#fff;--bg:#f2f3f5;--fg:#16181d;--mut:#5f6672;--ln:rgba(22,24,29,.13);--cd:#fbfbfc;--ga:rgba(255,255,255,.72);--gb:rgba(255,255,255,.3);--gl:rgba(255,255,255,.8);--hl:.55;--gs:0 10px 30px rgba(20,24,40,.16);--f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#3bc9db;--on:#0f1115;--bg:#0f1115;--fg:#eceef2;--mut:#9aa2b0;--ln:rgba(255,255,255,.13);--cd:#171a20;--ga:rgba(52,58,72,.55);--gb:rgba(26,30,40,.3);--gl:rgba(255,255,255,.2);--hl:.14;--gs:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--ac:#3bc9db;--on:#0f1115;--bg:#0f1115;--fg:#eceef2;--mut:#9aa2b0;--ln:rgba(255,255,255,.13);--cd:#171a20;--ga:rgba(52,58,72,.55);--gb:rgba(26,30,40,.3);--gl:rgba(255,255,255,.2);--hl:.14;--gs:0 10px 30px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--f);font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p,ul{margin:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.skip{position:absolute;left:-999px}
.skip:focus{left:12px;top:12px;z-index:100;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{position:relative;max-width:1040px;margin:0 auto;padding:28px 20px 128px}
.pg{animation:fd .2s ease-out}
@keyframes fd{from{opacity:0}}
.mut{color:var(--mut)}
.av{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:24px;flex:none;object-fit:cover}
h1{font-weight:700;font-size:clamp(2.7rem,10vw,5.6rem);line-height:.98;letter-spacing:-.035em;margin:28px 0 18px;max-width:14ch;text-wrap:balance}
h1.t{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;margin:6px 0 10px}
.sub{margin-bottom:28px}
.lead{font-size:clamp(1.2rem,3.6vw,1.6rem);max-width:28ch;color:var(--mut)}
.about{margin-top:18px;max-width:46ch}
.ab{display:flex;gap:18px;align-items:center;margin-top:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;background:var(--ac);color:var(--on);border:1px solid var(--ac)}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:transparent;color:var(--fg);border-color:var(--ln)}
.btn.g:hover{border-color:var(--fg);filter:none}
.blk{margin-top:72px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
h2{font-size:1.6rem;font-weight:650;letter-spacing:-.02em}
.bh a{font-size:14px;color:var(--ac)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.card{position:relative;background:var(--cd);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.card:hover{border-color:var(--fg)}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0}
.card a:focus-visible{outline:0}
.card a:focus-visible::after{outline:2px solid var(--ac);outline-offset:-2px;border-radius:14px}
.cv{aspect-ratio:16/10;display:grid;place-items:center;background:hsl(var(--h) 55% 58%);color:hsl(var(--h) 55% 16%);font-size:44px;font-weight:700}
.mt{padding:14px 16px 16px}
.mt h3{font-size:1.05rem;font-weight:600}
.mt p{color:var(--mut);font-size:14px}
.mt .dd{margin-top:8px}
.us{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln);font-size:14px}
.us span{overflow-wrap:anywhere}
.rws{list-style:none;padding:0;border-top:1px solid var(--ln)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:60px;padding:10px 4px;border-bottom:1px solid var(--ln);color:inherit;text-decoration:none}
a.rw:hover .rl{color:var(--ac)}
.rl{font-weight:600;font-size:1.05rem}
.rr{display:flex;align-items:center;gap:10px;min-width:0;color:var(--mut);font-size:15px;text-align:right;overflow-wrap:anywhere}
.rr a{color:var(--fg);text-underline-offset:3px}
.rr .i{width:18px;height:18px}
.cp{position:relative;z-index:1;flex:none;font:600 13px var(--f);min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--fg);cursor:pointer}
.cp:hover{border-color:var(--fg)}
.emp{border:1px dashed var(--ln);border-radius:14px;padding:28px 22px}
.emp h2{font-size:1.25rem;margin-bottom:6px}
.emp p{color:var(--mut);max-width:44ch}
.emp .btn{margin-top:18px}
footer{margin-top:80px;color:var(--mut);font-size:14px}
.fn{display:flex;flex-wrap:wrap;gap:0 22px;margin-bottom:8px}
.fn a{padding:8px 0;color:var(--fg);text-decoration:none;font-weight:500}
.fn a:hover{color:var(--ac)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);background:none;color:var(--fg);cursor:pointer;padding:0}
.ib .i{width:20px;height:20px}
.tm{position:absolute;top:20px;right:20px}
.glass{position:relative;background:linear-gradient(135deg,var(--ga),var(--gb));border:1px solid var(--gl);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--gs),inset 0 1px 0 var(--gl)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 100% at 15% 0,rgba(255,255,255,var(--hl)),transparent 50%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--cd)}}
.dock{position:fixed;inset:auto 0 0;z-index:40;display:flex;justify-content:center;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
.nav{pointer-events:auto;display:flex;align-items:stretch;width:min(100%,420px);padding:5px;border-radius:999px}
.brand,.tools{display:none}
.links{position:relative;flex:1;display:grid;grid-template-columns:repeat(5,1fr)}
.ind{position:absolute;top:0;bottom:0;left:0;width:var(--w,20%);transform:translateX(var(--x,0px));border-radius:999px;background:color-mix(in srgb,var(--fg) 10%,transparent);box-shadow:inset 0 0 0 1px var(--gl),inset 0 1px 6px rgba(255,255,255,var(--hl))}
.rdy .ind{transition:transform .4s cubic-bezier(.3,1.25,.45,1),width .4s cubic-bezier(.3,1.25,.45,1),opacity .2s}
.links a,.links button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;padding:8px 2px;font:500 11px/1 var(--f);color:var(--mut);background:none;border:0;border-radius:999px;cursor:pointer;text-decoration:none}
.links .more{display:none}
.links a:hover,.links button:hover,.links [aria-current]{color:var(--fg)}
.so{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 64px) 14px 14px;background:rgba(10,12,18,.35)}
.sp{width:min(100%,560px);max-height:calc(100% - 20px);overflow:auto;border-radius:22px;padding:10px;animation:pop .2s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.sr{display:flex;align-items:center;gap:10px;padding:2px 4px 2px 12px}
.sr input{flex:1;min-width:0;height:44px;font:500 17px var(--f);color:var(--fg);background:none;border:0;outline:0;-webkit-appearance:none;appearance:none}
#res{list-style:none;margin:6px 0 0;padding:0}
#res button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;min-height:44px;padding:10px 12px;text-align:left;font:500 16px var(--f);color:var(--fg);background:none;border:0;border-radius:12px;cursor:pointer}
#res button:hover,#res button:focus-visible{background:color-mix(in srgb,var(--fg) 8%,transparent)}
#res small{color:var(--mut);font-size:13px;font-weight:400}
.empty{padding:12px;color:var(--mut)}
@media(min-width:960px){
.dock{inset:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0}
.nav{width:auto;align-items:center;padding:5px 6px 5px 22px;gap:14px}
.brand{display:block;margin-right:12px;font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.links{display:flex;flex:none}
.links a,.links button{flex-direction:row;min-height:44px;padding:0 14px;font-size:14px}
.links a .i,.links #sb span{display:none}
.links #sb{padding:0 12px}
.links .more{display:flex}
.tools{display:flex}
.tools .ib{border:0;width:40px;height:40px}
.tm{display:none}
.wrap{padding:120px 32px 96px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
(()=>{
/* ================= EDIT YOUR CONTENT HERE ================= */
const CONFIG={
brand:'YerionHub',
name:'faviiona',
tagline:'Welcome to my little corner of the internet.',
bio:'Hello! Here with yerion! a small piece of beautiful world',
email:'yerionhub@gmail.com',
avatar:'',            // profile photo: 'avatar.jpg' (same folder) or a data: URL. Empty = initial letter
accent:'#0b7285',     // accent color, light mode
accentDark:'#3bc9db', // accent color, dark mode
socials:[             // no "url" = shown as a copyable username
{name:'Instagram',handle:'@faviiona',url:'https://www.instagram.com/faviiona/'},
{name:'TikTok',handle:'@faviiona',url:'https://www.tiktok.com/@faviiona'},
{name:'Discord',handle:'@faviiona_'}
],
games:[               // optional: url (official page)
{name:'Clash of Clans',genre:'Strategy',platform:'Mobile',user:'@Yerion'},
{name:'Call of Duty: Mobile',genre:'Shooter',platform:'Mobile',user:'@Yerion.'},
{name:'Roblox',genre:'Sandbox',user:'@faviiona'}
],
projects:[            // e.g. {title:'Logo set',summary:'Short text',category:'Design',year:2026,tools:['Figma'],url:'https://…'}
],
products:[            // e.g. {name:'Sticker pack',description:'Short text',category:'Digital',price:'Rp 15.000',url:'https://…'}
]
};
/* ========================================================== */

const C=CONFIG,SO=C.socials||[],GM=C.games||[],PJ=C.projects||[],PD=C.products||[];
const V=['home','about','games','portfolio','products','socials','contact'];
const T={home:'Home',about:'About',games:'Games',portfolio:'Portfolio',products:'Products',socials:'Socials',contact:'Contact'};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=u=>/^https:\/\/\S+$/i.test(u||'')?u:'';

const lum=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)};
const on=h=>lum(h)>.18?'#0f1115':'#fff';
const hex=/^#[0-9a-f]{6}$/i,ac=hex.test(C.accent)?C.accent:null,ad=hex.test(C.accentDark)?C.accentDark:ac;
if(ac){const st=document.createElement('style');st.textContent=`:root{--ac:${ac};--on:${on(ac)}}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:${ad};--on:${on(ad)}}}:root[data-theme="dark"]{--ac:${ad};--on:${on(ad)}}`;document.head.append(st)}

const hue=s=>[...String(s)].reduce((n,c)=>n+c.charCodeAt(0),0)*7%360;
const mono=s=>{const w=String(s||'?').split(/\s+/).filter(x=>x&&x.toLowerCase()!=='of');return (w.length>1?w[0][0]+w[w.length-1][0]:(w[0]||'?')[0]).toUpperCase()};
const join=a=>a.filter(Boolean).join(', ');
const ext='<svg class="i" aria-hidden="true"><use href="#s-ext"/></svg>';
const nt='<span class="vh"> (opens in a new tab)</span>';
const cp=(v,l)=>`<button type="button" class="cp" data-copy="${esc(String(v).replace(/^@/,''))}" aria-label="Copy ${esc(l)} username">Copy</button>`;
const card=(t,s,o={})=>{const l=safe(o.u);return `<article class="card"><div class="cv" style="--h:${hue(t)}" aria-hidden="true">${esc(mono(t))}</div><div class="mt"><h3>${l?`<a href="${esc(l)}" target="_blank" rel="noopener noreferrer">${esc(t)}${nt}</a>`:esc(t)}</h3>${s?`<p>${esc(s)}</p>`:''}${o.d?`<p class="dd">${esc(o.d)}</p>`:''}${o.x||''}</div></article>`};
const gm=g=>card(g.name,join([g.genre,g.platform]),{u:g.url,x:g.user?`<div class="us"><span>${esc(g.user)}</span>${cp(g.user,g.name)}</div>`:''});
const pj=p=>card(p.title,join([p.category,p.year]),{u:p.url,d:p.summary,x:p.tools&&p.tools.length?`<p>${esc(p.tools.join(', '))}</p>`:''});
const pd=p=>card(p.name,join([p.category,p.price]),{u:p.url,d:p.description});
const srow=s=>{const l=safe(s.url),n=esc(s.name),h=esc(s.handle);return l?`<li><a class="rw" href="${esc(l)}" target="_blank" rel="noopener noreferrer"><span class="rl">${n}</span><span class="rr">${h}${ext}${nt}</span></a></li>`:`<li class="rw"><span class="rl">${n}</span><span class="rr">${h}${cp(s.handle,s.name)}</span></li>`};
const socials=()=>SO.length?`<ul class="rws">${SO.map(srow).join('')}</ul>`:'';
const mail=()=>C.email?`<ul class="rws"><li class="rw"><span class="rl">Email</span><span class="rr"><a href="mailto:${esc(C.email)}">${esc(C.email)}</a><button type="button" class="cp" data-copy="${esc(C.email)}" aria-label="Copy email address">Copy</button></span></li></ul>`:'';
const gameRows=()=>GM.length?`<ul class="rws">${GM.map(g=>`<li class="rw"><span class="rl">${esc(g.name)}</span><span class="rr">${esc(g.user||'')}</span></li>`).join('')}</ul>`:'';
const av=()=>C.avatar?`<img class="av" src="${esc(C.avatar)}" alt="${esc(C.name)}">`:`<div class="av" aria-hidden="true">${esc((C.name||'?')[0].toLowerCase())}</div>`;
const btn=(go,l,c='')=>`<a class="btn ${c}" href="#${go}" data-go="${go}">${l}</a>`;
const ttl=(t,s)=>`<h1 class="t">${t}</h1>${s?`<p class="mut sub">${s}</p>`:''}`;
const grid=a=>a.length?`<div class="grid">${a.join('')}</div>`:'';
const sec=(t,go,l,b)=>b?`<section class="blk"><div class="bh"><h2>${t}</h2>${go?`<a href="#${go}" data-go="${go}">${l}</a>`:''}</div>${b}</section>`:'';
const emp=(t,p,go,l)=>`<div class="emp"><h2>${t}</h2><p>${p}</p>${go?btn(go,l,'g'):''}</div>`;

const P={
home:()=>`${av()}<h1>Hey, I’m ${esc(C.name)}.</h1><p class="lead">${esc(C.tagline)}</p><p class="about mut">${esc(C.bio)}</p><div class="row">${PJ.length?btn('portfolio','See my work'):btn('games','See my games')}${btn('socials','Find me online','g')}</div>`
 +sec('Games I play','games','See all games',grid(GM.slice(0,3).map(gm)))
 +sec('Selected work','portfolio','See all work',grid(PJ.slice(0,3).map(pj)))
 +sec('Products','products','See all products',grid(PD.slice(0,3).map(pd)))
 +sec('Elsewhere','socials','All profiles',socials())
 +sec('Contact','contact','Contact page',mail()),
about:()=>ttl('About')+`<div class="ab">${av()}<div><h2>${esc(C.name)}</h2><p class="mut">${esc(C.bio)}</p></div></div>`+sec('Games I play','games','See all games',gameRows())+sec
